<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Campus Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
    <main class="auth-card">
        <div class="brand-line"></div>
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="auth-title">Create Account</h3>
            <p class="auth-subtitle">Helping You Find What's Lost</p>
        </div>

        <form id="registerForm">
            <div class="mb-3">
                <label for="regName" class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 ps-3">
                        <i class="bi bi-card-text text-muted"></i>
                    </span>
                    <input type="text" id="regName" class="form-control border-start-0 ps-2" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="regUsername" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 ps-3">
                        <i class="bi bi-person text-muted"></i>
                    </span>
                    <input type="text" id="regUsername" class="form-control border-start-0 ps-2" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 ps-3">
                        <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input type="password" id="regPassword" class="form-control border-start-0 ps-2" placeholder="Create a password" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 ps-3">
                        <i class="bi bi-shield-lock text-muted"></i>
                    </span>
                    <input type="password" id="regConfirmPassword" class="form-control border-start-0 ps-2" placeholder="Re-enter password" required>
                </div>
            </div>

            <div id="registerMessage" class="mb-3 small text-center fw-bold" aria-live="polite"></div>

            <button type="submit" class="btn btn-primary-custom shadow-sm">
                Register Account <i class="bi bi-check2-circle ms-1"></i>
            </button>
        </form>

        <div class="auth-switch pt-3 border-top">
            <span>Already have an account?</span>
            <a href="index.html">Sign in here</a>
        </div>

        <p class="auth-footer">&copy; 2026 Campus Lost & Found</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
