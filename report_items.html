<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item | Campus Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="dashboard.html">
                <i class="bi bi-compass-fill me-2"></i>
                Campus Lost & Found
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="bi bi-grid-1x2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="report_items.html">
                            <i class="bi bi-plus-circle me-1"></i> Report Item
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="items.html">
                            <i class="bi bi-search me-1"></i> Lost & Found Items
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">
                            <i class="bi bi-shield-lock me-1"></i> Admin
                        </a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-sm btn-outline-light rounded-pill px-3 mt-1" href="#" onclick="logout(); return false;">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container page-container narrow-container">
        <div class="page-heading">
            <div>
                <h1>Report a Lost or Found Item</h1>
                <p>Fill in the details below to submit an item report to the campus board</p>
            </div>
        </div>

        <div class="content-card p-4 p-sm-5">
            <form id="reportForm">
                <div class="mb-3">
                    <label for="itemType" class="form-label">Report Type</label>
                    <select id="itemType" class="form-select" required>
                        <option value="" disabled selected>Select status</option>
                        <option value="Lost">Lost Item</option>
                        <option value="Found">Found Item</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="itemName" class="form-label">Item Name</label>
                    <input type="text" id="itemName" class="form-control" placeholder="e.g. Student ID Card, iPhone 13, Black Wallet" required>
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select id="category" class="form-select" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Documents">Documents & Cards</option>
                        <option value="Personal Belongings">Personal Belongings</option>
                        <option value="Stationery">Stationery & Books</option>
                        <option value="Bags">Bags</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="location" class="form-label">Location Last Seen /Found</label>
                    <input type="text" id="location" class="form-control" placeholder="e.g. Library Level 2, Faculty of Computing" required>
                </div>

                <div class="mb-3">
                    <label for="itemDate" class="form-label">Date</label>
                    <input type="date" id="itemDate" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description & Details</label>
                    <textarea id="description" class="form-control" rows="3" placeholder="Provide distinct features, color, brand, or contact info..." required></textarea>
                </div>

                <div class="mb-3">
                    <label for="itemImage" class="form-label">Upload Item Image (Optional, Max 2MB)</label>
                    <input type="file" id="itemImage" class="form-control" accept="image/*">
                    <div id="imagePreview" class="image-preview-wrap"></div>
                </div>

                <div id="successMessage" class="form-message fw-bold text-center" aria-live="polite"></div>

                <button type="submit" class="btn btn-primary-custom w-100 shadow-sm py-2">
                    Submit Report <i class="bi bi-send ms-1"></i>
                </button>
            </form>
        </div>
    </main>

    <footer class="site-footer mt-auto">
        <div class="container">
            &copy; 2026 Campus Lost & Found. All Rights Reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
