<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Campus Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
    <main class="auth-card">
        <div class="brand-line"></div>
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3">
                <i class="bi bi-compass-fill"></i>
            </div>
            <h3 class="auth-title">Campus Lost & Found</h3>
            <p class="auth-subtitle">Find What's Lost, Share What's Found</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 ps-3">
                        <i class="bi bi-person text-muted"></i>
                    </span>
                    <input type="text" id="username" class="form-control border-start-0 ps-2" value="student" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 ps-3">
                        <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input type="password" id="password" class="form-control border-start-0 ps-2" value="student123" required>
                </div>
            </div>

            <div id="loginMessage" class="mb-3 small text-center fw-bold" aria-live="polite"></div>

            <button type="submit" class="btn btn-primary-custom shadow-sm">
                Sign In <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        <div class="demo-login text-center">
            <span class="d-block fw-bold mb-2"><Q>Quick Login</Q></span>
            <div class="d-flex gap-2 justify-content-center">
                <button type="button" class="btn btn-sm btn-outline-dark w-50" onclick="fillDemo('student', 'student123')">
                    <i class="bi bi-mortarboard me-1"></i> Student
                </button>
                <button type="button" class="btn btn-sm btn-outline-dark w-50" onclick="fillDemo('admin', 'admin123')">
                    <i class="bi bi-shield-check me-1"></i> Admin
                </button>
            </div>
        </div>

        <div class="auth-switch pt-3 border-top">
            <span>Don't have an account?</span>
            <a href="register.html">Register here</a>
        </div>

        <p class="auth-footer">&copy; 2026 Campus Lost & Found</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
